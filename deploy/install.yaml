apiVersion: install.ate.dev/v1alpha1
kind: SubstrateInstall
namespace: ate-system
context: kind-agent-box
kindCluster:
  enabled: true
  name: agent-box
images:
  repo: localhost:5001/substrate
  tag: v0.5.0
rolloutTimeout: 5m0s
storage:
  bucketName: ate-snapshots
ateapi:
  postgres:
    storageClass: standard
atenet:
  dataplane: envoy
  egress:
    credentialProvider: '{"enabled":false}'
