apiVersion: v1
kind: Namespace
metadata:
  name: pvm-agents
  labels:
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: panel
  namespace: pvm-agents
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: panel-worker-scaler
  namespace: pvm-agents
rules:
- apiGroups: [ate.dev]
  resources: [workerpools]
  resourceNames: [agents]
  verbs: [get]
- apiGroups: [ate.dev]
  resources: [workerpools/scale]
  resourceNames: [agents]
  verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: panel-worker-scaler
  namespace: pvm-agents
subjects:
- kind: ServiceAccount
  name: panel
  namespace: pvm-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: panel-worker-scaler
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: agents
  namespace: pvm-agents
  labels:
    workload: pvm-agents
spec:
  replicas: 3
  workerImage: WORKER_IMAGE
  sandboxClasses:
  - name: gvisor
    configRef:
      name: gvisor-default
  template:
    resources:
      requests: {cpu: "8", memory: 8Gi}
      limits: {cpu: "8", memory: 8Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: panel
  namespace: pvm-agents
spec:
  selector: {app: panel}
  ports:
  - {name: https, port: 8443, targetPort: 8443}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: panel-sessions
  namespace: pvm-agents
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: agent-thin
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel
  namespace: pvm-agents
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: panel}
  template:
    metadata:
      labels: {app: panel}
    spec:
      serviceAccountName: panel
      automountServiceAccountToken: false
      securityContext: {runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      containers:
      - name: panel
        image: PANEL_IMAGE
        env: [{name: WORKER_MAX_REPLICAS, value: '8'}]
        ports: [{containerPort: 8443, name: https}]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: "2", memory: 256Mi}
        readinessProbe:
          tcpSocket: {port: https}
        volumeMounts:
        - {name: panel, mountPath: /run/panel, readOnly: true}
        - {name: auth, mountPath: /run/auth, readOnly: true}
        - {name: identity, mountPath: /run/identity, readOnly: true}
        - {name: servicedns, mountPath: /run/servicedns, readOnly: true}
        - {name: ate-token, mountPath: /run/ate-token, readOnly: true}
        - {name: kubernetes, mountPath: /run/kubernetes, readOnly: true}
        - {name: panel-sessions, mountPath: /var/lib/agent-box-auth}
      volumes:
      - name: panel-sessions
        persistentVolumeClaim: {claimName: panel-sessions}
      - name: kubernetes
        projected:
          defaultMode: 0440
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              name: kube-root-ca.crt
              items: [{key: ca.crt, path: ca.crt}]
      - name: panel
        secret: {secretName: panel, defaultMode: 0440}
      - name: auth
        secret: {secretName: chatgpt-auth, defaultMode: 0440}
      - name: identity
        projected:
          defaultMode: 0440
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential.pem
      - name: servicedns
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels: {podcert.ate.dev/canarying: live}
              path: trust.pem
      - name: ate-token
        projected:
          sources:
          - serviceAccountToken:
              audience: api.ate-system.svc
              expirationSeconds: 3600
              path: token
