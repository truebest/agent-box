title = "Agent Box secret detection"

[extend]
useDefault = true

[[rules]]
id = "devin-api-key"
description = "Devin / Cognition API credential"
regex = '''\bcog_[A-Za-z0-9_-]{20,}\b'''
keywords = ["cog_"]

# Exact values in unchanged, public upstream test fixtures and documentation.
# Do not allowlist directories: a different credential in these files must fail.

[[allowlists]]
description = "Public upstream fixture: vendor/substrate/.agents/skills/review-crds/references/api-conventions.md"
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)vendor/substrate/\.agents/skills/review\-crds/references/api\-conventions\.md$''']
regexes = [
  '''^WhCDvq4VPpYhrcfmF6ei7V9qlbqTubUc$''',
]

[[allowlists]]
description = "Public upstream fixture: vendor/substrate/docs/egress-credential-injection.md"
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)vendor/substrate/docs/egress\-credential\-injection\.md$''']
regexes = [
  '''^placeholder$''',
]

[[allowlists]]
description = "Public upstream fixture: vendor/herdr-web-ui/server/voice.test.ts"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)vendor/herdr\-web\-ui/server/voice\.test\.ts$''']
regexes = [
  '''^sk\-test\-0123456789abcdef$''',
]

